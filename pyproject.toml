# Konfiguracja projektu ZOP-TECH-01.
# Pakiet instalujemy lokalnie w trybie edytowalnym (pip install -e .), żeby `import xray`
# działał tak samo w pytest, w demonstracji i w skryptach — bez ustawiania PYTHONPATH,
# które inaczej wygląda w Git Bashu, a inaczej w PowerShellu.

[project]
name = "zoptymalizowani-xray"
version = "0.1.0"
description = "X-Ray — silnik diagnostyczny organizacji. Fundament ZOP-TECH-01."
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0",
    "pydantic>=2.13",
    "openpyxl>=3.1",
    "pyarrow>=25.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pythonpath zostaje jako zabezpieczenie: testy przechodzą także wtedy, gdy ktoś nie
# zdążył wykonać `pip install -e .`.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
